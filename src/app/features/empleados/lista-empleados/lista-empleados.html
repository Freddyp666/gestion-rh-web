<h2>Lista de Empleados</h2>
<table class="table table-striped">
<thead class="table-dark">
    <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
    </tr>
    </thead>
    <tbody>
        @for (item of empleados; track $index) {
            <tr>
                <td>{{item.nombre}}</td>
                <td>{{item.apellido}}</td>
                <td>{{item.email}}</td>
            </tr>
        }
        <tr>
            <td></td>
        </tr>
    </tbody>

</table>
