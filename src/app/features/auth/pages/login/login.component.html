
<div class="login-card">    

    <div class="avatar">
        
        <span>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier"> 
                    <path d="M14 19.2857L15.8 21L20 17M4 21C4 17.134 7.13401 14 11 14C12.4872 14 13.8662 14.4638 15 15.2547M15 7C15 9.20914 13.2091 11 11 11C8.79086 11 7 9.20914 7 7C7 4.79086 8.79086 3 11 3C13.2091 3 15 4.79086 15 7Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-darkreader-inline-stroke="" style="--darkreader-inline-stroke: var(--darkreader-text-000000, #e8e6e3);"></path> </g></svg>
        </span>
    </div>
    <h2>Iniciar Sesión</h2>
    

    <form >
        <label>Usuario o correo electrónico</label>
        <input type="text" placeholder="Ingresa tu usuario o correo electrónico">

        <label>Contraseña</label>
        <input type="password" placeholder="Ingresa tu contraseña">

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Recordar sesión</label>
        </div>

        <button type="submit">Iniciar sesión</button>
        <div class="extra">
            <a href="#" >¿Olvidaste tu contraseña?</a>
           

            <p> ¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate</a></p>
        </div>
    </form>
</div>
